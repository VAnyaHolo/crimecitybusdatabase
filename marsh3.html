
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Маршрут 25</title>
<link rel="stylesheet" href="css/style.css">

<style>

.leave-button {
margin: 15px 50px;
}
    
.comp-info {
padding: 20px 30px ;
margin: 0;
color: #666;
font-size: 18px ;
margin-top: 20px ;
}

.comp-info p {
padding: 10px 0;
border-bottom: 1px solid #eeeeee;
color: #222222;
}

.bus-entry {
display: flex;
align-items: center;
gap: 15px;
padding: 15px;
margin: 15px 50px;
background: #252525;
border: 1px solid #444;
border-radius: 10px;
color: white;
}

.bus-number {
font-size: 18px;
font-weight: bold;
}

.plate {
display: inline-block;
padding: 5px 10px;
background: #eeeeee;
color: #111111;
border: 2px solid #222222;
border-radius: 4px;
text-decoration: none;
font-weight: bold;
}

.bus-model {
margin-left: auto;
}

.photo-gallery {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
gap: 15px;
margin-top: 15px;
}

.photo-gallery img {
width: 100%;
height: 200px;
object-fit: cover;
border-radius: 8px;
border: 1px solid #dddddd;
cursor: pointer;
transition: transform 0.2s;
}

.photo-gallery img:hover {
transform: scale(1.02);
}
.photo-gallery {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
gap: 18px;
margin-top: 20px;
}

.photo-card {
background: #ffffff;
border: 1px solid #dddddd;
border-radius: 10px;
overflow: hidden;
color: #222222;
}

.photo-card img {
width: 100%;
height: 190px;
object-fit: cover;
display: block;
cursor: pointer;
transition: 0.2s;
}

.photo-card img:hover {
opacity: 0.85;
}

.photo-details {
padding: 12px;
}

.photo-details p {
margin: 5px 0;
color: #555555;
font-size: 14px;
}
#photo-viewer {
display: none;
position: fixed;
z-index: 99999;
inset: 0;
background: rgba(0, 0, 0, 0.92);
justify-content: center;
align-items: center;
border: none;
padding: 0;
box-sizing: border-box;
}

#large-photo {
width: auto;
height: auto;
max-width: 95vw;
max-height: 90vh;
object-fit: contain;
border: none;
border-radius: 4px;
display: block;
}

.close-photo {
position: absolute;
top: 15px;
right: 25px;
color: white;
font-size: 40px;
cursor: pointer;
}

</style>
</head>
<body>

<header>
<h1>Подвижной состав маршрута</h1>
<p>Маршрут 25 CRIME CITY</p>
</header>

<div class="comp-info">
<p><strong>Описание:</strong> Основано в 2026. Башня (г. Южный) - ПЗУ (Село Простоквасино)</p>
</div>

<main>
<section>
<div class="bus-entry">
<span class="bus-number">0025</span>

<a href="bus-0025.html" class="plate">
А952ТК14
</a>

<span class="bus-model">ПАЗ-672М</span>
</div>

<h2>Фото маршрута</h2>

<div class="photo-gallery">

<div class="photo-card">
<img src="images/marsh25.jpg" alt="Маршрут 25"
onclick="openPhoto(this.src)">
<div class="photo-details">
<strong>Путевой лист</strong>
<p> Дата: 18 ноября 2026</p>
</div>
<div id="photo-viewer" onclick="closePhoto()">
<span class="close-photo">&times;</span>
<img id="large-photo" src="" alt="Увеличенная фотография">
</div>

<script>
function openPhoto(src) {
document.getElementById("large-photo").src = src;
document.getElementById("photo-viewer").style.display = "flex";
}

function closePhoto() {
document.getElementById("photo-viewer").style.display = "none";
}
</script>

<div class="leave-button">
<a href="companies.html">← Назад в список компаний и маршрутов</a>
</div>
</main>
<footer>
CRIME CITY Bus Database © 2026
</footer>

</body>

</html>
