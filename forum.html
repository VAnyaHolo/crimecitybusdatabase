
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRIME CITY — Forum</title>
<link rel="stylesheet" href="css/style.css">

<style>
body {
background: #111;
color: #eee;
font-family: Arial, sans-serif;
}

.forum-container {
max-width: 1000px;
margin: 50px auto;
padding: 20px;
}

.forum-header {
border-bottom: 1px solid #333;
padding-bottom: 20px;
margin-bottom: 30px;
}

.forum-post {
background: #1b1b1b;
border: 1px solid #333;
border-radius: 8px;
padding: 20px;
margin-bottom: 15px;
}

.forum-empty {
text-align: center;
padding: 30px;
color: #aaa;
}

input {
display: block;
width: 100%;
box-sizing: border-box;
padding: 12px;
margin: 10px 0;
background: #252525;
color: white;
border: 1px solid #444;
border-radius: 5px;
}

button {
padding: 12px 20px;
background: #333;
color: white;
border: 1px solid #555;
border-radius: 5px;
cursor: pointer;
}

button:hover {
background: #444;
}

#auth-message {
color: #ddd;
overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div class="forum-container">

<header class="forum-header">
<h1>CRIME CITY — FORUM</h1>
<p>Сообщество и обсуждения транспортной базы</p>
</header>

<section class="forum-post" id="auth-panel">

<h2>Аккаунт CRIME CITY</h2>

<h3>Регистрация</h3>

<form id="signup-form">
<input type="text" id="signup-username"
placeholder="Имя пользователя"
minlength="3" maxlength="24" required>

<input type="email" id="signup-email"
placeholder="Электронная почта" required>

<input type="password" id="signup-password"
placeholder="Пароль" minlength="8" required>

<button type="submit">Зарегистрироваться</button>
</form>

<h3>Вход</h3>

<form id="login-form">
<input type="email" id="login-email"
placeholder="Электронная почта" required>

<input type="password" id="login-password"
placeholder="Пароль" required>

<button type="submit">Войти</button>
</form>

<p id="auth-message"></p>

</section>

<section>
<h2>Обсуждения</h2>
<div id="forum-posts">
<div class="forum-empty">Загрузка обсуждений...</div>
</div>
</section>

</div>

<script type="module">
import { supabase } from './js/supabase.js';

const message = document.getElementById('auth-message');
const postsContainer = document.getElementById('forum-posts');

// Регистрация

document.getElementById('signup-form')
.addEventListener('submit', async (e) => {
e.preventDefault();

message.textContent = 'Регистрация...';

const username = document.getElementById('signup-username').value.trim();
const email = document.getElementById('signup-email').value.trim();
const password = document.getElementById('signup-password').value;

try {
const { data, error } = await supabase.auth.signUp({
email,
password,
options: {
data: { username }
}
});

if (error) throw error;

message.textContent = data.session
? 'Регистрация успешна! Ты вошёл в аккаунт.'
: 'Проверь почту для подтверждения регистрации.';

} catch (error) {
message.textContent = 'Ошибка регистрации: ' + error.message;
console.error(error);
}
});

// Вход

document.getElementById('login-form')
.addEventListener('submit', async (e) => {
e.preventDefault();

message.textContent = 'Выполняется вход...';

const email = document.getElementById('login-email').value.trim();
const password = document.getElementById('login-password').value;

try {
const { error } = await supabase.auth.signInWithPassword({
email,
password
});

if (error) throw error;

message.textContent = 'Успешный вход в Форум!';

} catch (error) {
message.textContent = 'Ошибка входа: ' + error.message;
console.error(error);
}
});

// Безопасный вывод текста

function escapeHTML(value) {
const div = document.createElement('div');
div.textContent = value ?? '';
return div.innerHTML;
}

// Загрузка обсуждений

async function loadPosts() {
try {
const { data, error } = await supabase
.from('forum_posts')
.select('*')
.order('created_at', { ascending: false });

if (error) throw error;

if (!data || data.length === 0) {
postsContainer.innerHTML =
'<div class="forum-empty">Пока нет обсуждений. Будь первым!</div>';
return;
}

postsContainer.innerHTML = data.map(post => `
<article class="forum-post">
<h3>${escapeHTML(post.username)}</h3>
<p>${escapeHTML(post.content)}</p>
</article>
`).join('');

} catch (error) {
postsContainer.textContent =
'Не удалось загрузить обсуждения: ' + error.message;
console.error(error);
}
}

loadPosts();
</script>

</body>
</html>
